<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C•E•GO Travel Planner V1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:880px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.05)}h1{margin-bottom:4px}.muted{color:#777;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px;color:#666;display:block;margin-bottom:5px}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}button{background:#e65a2f;color:white;font-weight:800;border:0;cursor:pointer}.days{display:grid;gap:12px}.day{border:1px solid #eee;border-radius:16px;padding:14px}.stop{padding:8px 0;border-bottom:1px dashed #ddd}.stop:last-child{border-bottom:0}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>C•E•GO Travel Planner</h1><div class="muted">V1｜先證明「輸入偏好 → 自動排出可用行程」</div><div class="card"><div class="grid"><div><label>目的地</label><select id="city"><option>釜山</option><option>首爾</option><option>曼谷</option></select></div><div><label>日數</label><select id="days"><option>1</option><option selected>2</option><option>3</option></select></div><div><label>預算</label><select id="budget"><option>慳住玩</option><option selected>正常</option><option>鬆動</option></select></div><div><label>同行</label><select id="party"><option>一個人</option><option selected>兩個人</option><option>家庭</option></select></div><div><label>興趣</label><select id="interest"><option>美食</option><option>咖啡</option><option>打卡</option><option>購物</option><option>混合</option></select></div><div><label>節奏</label><select id="pace"><option>輕鬆</option><option selected>正常</option><option>密集</option></select></div></div><div style="margin-top:14px"><button id="go">幫我排行程</button></div></div><div class="card"><h2>建議行程</h2><div id="result" class="days"><div class="muted">揀好條件後按「幫我排行程」。</div></div></div><div class="muted">V1 暫用 CEGO 已有示範資料；之後再接正式 CEGO 景點／餐廳／咖啡資料層。暫不做即時機票、酒店、複雜交通與即時價格。</div></div><script>const data={釜山:['南浦洞早餐','松島海上纜車','甘川文化村','海里海鮮午餐','Momo Coffee','富平罐頭市場'],首爾:['明洞早餐','聖水洞','咖啡店','HYBE / YG 周邊','東大門晚餐','夜景散步'],曼谷:['Terminal 21','Ari 甜品','舊城小食','Hidden Bar 周邊','Big C 手信','夜市']};document.querySelector('#go').onclick=()=>{const city=document.querySelector('#city').value,days=+document.querySelector('#days').value,items=data[city],out=[];for(let d=0;d<days;d++){const stops=[];for(let i=0;i<3;i++)stops.push(items[(d*3+i)%items.length]);out.push(`<div class="day"><b>Day ${d+1}</b>${stops.map((s,i)=>`<div class="stop">${['上午','下午','晚上'][i]}｜${s}</div>`).join('')}</div>`)}document.querySelector('#result').innerHTML=out.join('')};</script></body></html>
