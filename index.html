<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C•E•GO Travel Planner V2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.05)}h1{margin-bottom:4px}.muted{color:#777;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px;color:#666;display:block;margin-bottom:5px}select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}button{background:#e65a2f;color:white;font-weight:800;border:0;cursor:pointer}.days{display:grid;gap:12px}.day{border:1px solid #eee;border-radius:16px;padding:14px}.stop{padding:10px 0;border-bottom:1px dashed #ddd}.stop:last-child{border-bottom:0}.badge{display:inline-block;background:#f4f2ed;border-radius:999px;padding:4px 7px;font-size:11px;margin-left:5px}.zone{color:#777;font-size:12px}.summary{background:#171717;color:#fff;border-radius:14px;padding:12px;margin-bottom:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>C•E•GO Travel Planner</h1><div class="muted">V2｜改用 CEGO 實際去過／整理過的資料，再按興趣、區域和節奏排列</div><div class="card"><div class="grid"><div><label>目的地</label><select id="city"><option>釜山</option><option>首爾</option><option>曼谷</option></select></div><div><label>日數</label><select id="days"><option>1</option><option selected>2</option><option>3</option></select></div><div><label>預算</label><select id="budget"><option>慳住玩</option><option selected>正常</option><option>鬆動</option></select></div><div><label>同行</label><select id="party"><option>一個人</option><option selected>兩個人</option><option>家庭</option></select></div><div><label>興趣</label><select id="interest"><option>混合</option><option>美食</option><option>咖啡</option><option>打卡</option><option>購物</option><option>K-pop</option></select></div><div><label>節奏</label><select id="pace"><option>輕鬆</option><option selected>正常</option><option>密集</option></select></div></div><div style="margin-top:14px"><button id="go">幫我排行程</button></div></div><div class="card"><h2>建議行程</h2><div id="result" class="days"><div class="muted">揀好條件後按「幫我排行程」。</div></div></div><div class="muted">目前優先用 CEGO 自己資料，不亂補陌生景點。下一步可再加地圖座標、實際交通時間及收藏／分享。</div></div><script>
let db={};
fetch('data/places.json').then(r=>r.json()).then(x=>db=x).catch(()=>{});
function score(p,interest){let s=p.tested?20:0;if(interest==='混合')s+=5;else if(p.tags.includes(interest))s+=30;return s}
function makePlan(city,days,interest,pace){const all=[...(db[city]||[])].sort((a,b)=>score(b,interest)-score(a,interest));const perDay=pace==='輕鬆'?2:pace==='密集'?4:3;const used=new Set(),out=[];for(let d=0;d<days;d++){let picks=[];const available=all.filter(x=>!used.has(x.name));if(!available.length)break;const seed=available[0];picks.push(seed);used.add(seed.name);const sameZone=available.filter(x=>x.zone===seed.zone&&!used.has(x.name));for(const x of sameZone){if(picks.length>=perDay)break;picks.push(x);used.add(x.name)}for(const x of all){if(picks.length>=perDay)break;if(!used.has(x.name)){picks.push(x);used.add(x.name)}}picks.sort((a,b)=>['上午','下午','晚上'].indexOf(a.period)-['上午','下午','晚上'].indexOf(b.period));out.push(picks)}return out}
document.querySelector('#go').onclick=()=>{const city=document.querySelector('#city').value,days=+document.querySelector('#days').value,interest=document.querySelector('#interest').value,pace=document.querySelector('#pace').value,budget=document.querySelector('#budget').value,party=document.querySelector('#party').value;const plan=makePlan(city,days,interest,pace);document.querySelector('#result').innerHTML=`<div class="summary">${city}｜${days} 日｜${interest}｜${pace}｜${party}｜${budget}</div>`+plan.map((items,d)=>`<div class="day"><b>Day ${d+1}</b>${items.map(x=>`<div class="stop"><b>${x.period}｜${x.name}</b><span class="badge">CEGO 實測/整理</span><div class="zone">${x.zone} · ${x.tags.join(' · ')}</div></div>`).join('')}</div>`).join('')};
</script></body></html>
